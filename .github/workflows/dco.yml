name: dco
on: pull_request
permissions:
  contents: read
jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            want="Signed-off-by: $(git log -1 --format='%an <%ae>' "$c")"
            if ! git log -1 --format=%B "$c" | grep -qxF "$want"; then
              echo "::error::$(git log -1 --format='%h %s' "$c") is missing '$want'"
              fail=1
            fi
          done
          [ "$fail" = 0 ] || { echo "Sign off with 'git commit -s'; see CONTRIBUTING.md."; exit 1; }
